name: Bump GLPI Agent Cask

on:
  schedule:
    - cron: '0 0 * * *' # Check for updates daily
  workflow_dispatch:

jobs:
  bump:
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Setup Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Configure Git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Fetch latest version
        id: get_version
        run: |
          LATEST_VERSION=$(curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/glpi-project/glpi-agent/releases/latest | jq -r .tag_name | sed 's/^v//')
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Bump Cask
        run: |
          brew bump-cask-pr --write-only --commit --version=${{ steps.get_version.outputs.version }} eduardomozart/glpi-agent/glpi-agent || true
          git push origin HEAD:main
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
